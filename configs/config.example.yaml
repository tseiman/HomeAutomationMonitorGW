server:
  listen: "192.168.1.20:443"
  certificate: "/etc/automation-gateway/tls/server.crt"
  private_key: "/etc/automation-gateway/tls/server.key"
  read_timeout: "10s"
  write_timeout: "15s"
  idle_timeout: "60s"
  shutdown_timeout: "15s"
  max_header_bytes: 16384

authentication:
  # One to 32 protected token files and one to 128 client addresses/networks are required.
  bearer_token_files:
    - "/etc/automation-gateway/tokens/zabbix"
    - "/etc/automation-gateway/tokens/revpi-status"
  # Include the actual TCP source addresses of Zabbix and status/SSE clients.
  # CIDR entries must be canonical networks without host bits.
  allowed_clients:
    - "192.168.2.232"
    - "192.168.2.0/24"
    - "2001:db8:1234::/64"

# In-memory delta replay. All limits are strict and reloadable; a successful
# reload creates a new cursor generation, so readers must take a new full snapshot.
delta:
  heartbeat: "5m"          # unchanged metrics are repeated at this interval (5s-24h)
  retention_age: "30m"     # replay age window (1m-24h)
  poll_full_interval: "10m" # periodic full resync for token-identified pollers (1m-24h)
  max_events: 10000        # whole poll transactions (1-1000000)
  max_bytes: 67108864      # approximate encoded journal bytes (1KiB-1GiB)

logging:
  level: "info"

# Sources are independent. Remove an entry or set enabled: false to skip it
# completely, including its semantic validation, files, connections, and workers.
sources:
  - name: "ups-main"
    driver: "nut"
    enabled: true
    poll_interval: "10s"
    stale_after: "30s"
    timeout: "5s"
    nut:
      server: "127.0.0.1:3493"
      ups: "quint"

  - name: "controller-main"
    driver: "snmp"
    enabled: true
    poll_interval: "30s"
    stale_after: "90s"
    timeout: "5s"
    snmp:
      address: "192.168.1.11"
      port: 161
      # Conservative for older embedded agents; valid range is 1-32.
      max_oids_per_request: 16
      # This fixed allowlist is the only set polled in normal operation.
      oids:
        - "1.3.6.1.2.1.1.3.0"
        - "1.3.6.1.2.1.1.5.0"
      metadata_file: "/etc/automation-gateway/mib-metadata.json"
      security:
        version: "3"
        username: "monitoring-account"
        auth_protocol: "SHA"
        auth_passphrase_file: "/etc/automation-gateway/secrets/controller-auth"
        privacy_protocol: "DES"
        privacy_passphrase_file: "/etc/automation-gateway/secrets/controller-priv"
      discovery:
        enabled: true
        # Discovery aborts without caching partial data when this bound is exceeded.
        max_objects: 2048
        timeout: "2m"
        root_oids:
          - "1.3.6.1.2.1"
          - "1.3.6.1.4.1"

  # Disabled entries may retain incomplete or semantically invalid known values.
  # Unknown YAML field names are still rejected as likely operator mistakes.
  - name: "future-source"
    driver: "snmp"
    enabled: false
    snmp:
      address: "not-configured-yet"

# For a complete, independently parseable generic Modbus RTU source using the
# exact schema, see modbus-sirax-bt72xx.example.yaml. Modbus register addresses
# are zero-based PDU offsets. Only FC01-FC04 reads are supported; scale/offset
# are applied once in the gateway, and API/SSE requests read only the cache.
