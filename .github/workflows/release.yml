# File: .github/workflows/release.yml
# Purpose: Build and publish release archives and Debian packages only for version tags.
# Generated by: aiAgentTseiman (Hermes Agent)
# Generated on: 2026-10-09

name: Tagged release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Verify tagged source
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        shell: bash
        run: |
          set +e
          go test ./... 2>&1 | tee test-output.log
          test_status=${PIPESTATUS[0]}
          set -e
          if [[ "$test_status" -ne 0 ]]; then
            python3 - <<'PY'
          from pathlib import Path
          lines = Path("test-output.log").read_text(errors="replace").splitlines()[-30:]
          message = "\n".join(lines).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error file=.github/workflows/release.yml,line=39::{message}")
          PY
            exit "$test_status"
          fi

      - name: Run static analysis
        run: go vet ./...

      - name: Run race-enabled core tests
        run: go test -race ./internal/... ./cmd/... ./zabbix/... ./systemd/...

      - name: Verify CGO-free gateway cross-builds
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -o "${RUNNER_TEMP}/automation-gateway-armv7" ./cmd/gateway
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o "${RUNNER_TEMP}/automation-gateway-arm64" ./cmd/gateway

  package:
    name: Package ${{ matrix.arch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
          - armv7
          - "386"

    steps:
      - name: Check out the tagged commit and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release material and Debian package
        run: ./scripts/package_release.sh "${{ matrix.arch }}" --deb

      - name: Upload architecture artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            automation-gateway-linux-${{ matrix.arch }}
            automation-gateway-linux-${{ matrix.arch }}.sha256
            automation-gateway-led-linux-${{ matrix.arch }}
            automation-gateway-led-linux-${{ matrix.arch }}.sha256
            automation-gateway-*-linux-${{ matrix.arch }}.tar.gz
            automation-gateway-*-linux-${{ matrix.arch }}.tar.gz.sha256
            automation-gateway-windows-${{ matrix.arch }}.exe
            automation-gateway-windows-${{ matrix.arch }}.exe.sha256
            automation-gateway-*-windows-${{ matrix.arch }}.zip
            automation-gateway-*-windows-${{ matrix.arch }}.zip.sha256
            automation-gateway_*.deb
            automation-gateway_*.deb.sha256
            automation-gateway-led_*.deb
            automation-gateway-led_*.deb.sha256

  release:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Check out release license files
        uses: actions/checkout@v7

      - name: Download all architecture artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and upload files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --verify-tag --generate-notes --title "$TAG_NAME"
          fi
          gh release upload "$TAG_NAME" release-assets/* LICENSE THIRD_PARTY_LICENSES.md --clobber

  apt-repository:
    name: Build signed APT repository
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository tooling and public key
        uses: actions/checkout@v7

      - name: Download all Debian packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Install APT repository tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes apt-utils dpkg-dev gnupg

      - name: Build repository indexes
        run: ./scripts/build_apt_repository.sh release-assets pages-site/apt stable

      - name: Sign repository metadata
        env:
          APT_SIGNING_PRIVATE_KEY: ${{ secrets.APT_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$APT_SIGNING_PRIVATE_KEY" || {
            echo "APT_SIGNING_PRIVATE_KEY is not configured" >&2
            exit 1
          }
          export GNUPGHOME="$(mktemp -d)"
          chmod 0700 "$GNUPGHOME"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$APT_SIGNING_PRIVATE_KEY" | gpg --batch --import
          fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          expected='FBB4E68DABB4A25F6E73C81DD4EA266E8BC8043F'
          test "$fingerprint" = "$expected" || {
            echo "configured APT signing key has the wrong fingerprint" >&2
            exit 1
          }
          public_fingerprint="$(gpg --batch --show-keys --with-colons packaging/apt/homeautomationmonitorgw-archive-key.asc | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$public_fingerprint" = "$expected"
          cp packaging/apt/homeautomationmonitorgw-archive-key.asc pages-site/apt/repository-key.asc
          cp packaging/apt/FINGERPRINT pages-site/apt/FINGERPRINT
          gpg --batch --yes --local-user "$fingerprint" --armor \
            --detach-sign --output pages-site/apt/dists/stable/Release.gpg \
            pages-site/apt/dists/stable/Release
          gpg --batch --yes --local-user "$fingerprint" --clearsign \
            --output pages-site/apt/dists/stable/InRelease \
            pages-site/apt/dists/stable/Release
          gpg --batch --verify pages-site/apt/dists/stable/Release.gpg \
            pages-site/apt/dists/stable/Release
          gpg --batch --verify pages-site/apt/dists/stable/InRelease

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload APT repository as GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site

  deploy-apt-repository:
    name: Publish signed APT repository
    needs: apt-repository
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
