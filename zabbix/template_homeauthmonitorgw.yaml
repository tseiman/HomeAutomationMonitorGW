              discover: NO_DISCOVER
              status: DISABLED
              history: '7d'
              trends: '30d'
              value_type: UNSIGNED
              units: unixtime
              description: 'UTC Unix time attached to the cached numeric metric value.'
              master_item:
                key: automation.gateway.snapshot
              preprocessing:
                - type: JSONPATH
                  error_handler: DISCARD_VALUE
                  parameters:
                    - '{#TIMESTAMP_JSONPATH}'
                - type: JAVASCRIPT
                  error_handler: DISCARD_VALUE
                  parameters:
                    - |
                      var timestamp = Date.parse(value);
                      if (isNaN(timestamp) || timestamp < 0) {
                          throw 'invalid metric timestamp';
                      }
                      return Math.floor(timestamp / 1000);
              tags:
                - tag: component
                  value: metric
                - tag: source
                  value: '{#SOURCE}'
